<title>TEDxGUC Door Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #E62B1E; --ink: #141414; --paper: #FAFAF7; --line: #2a2a2a;
    --ok: #1E9E55; --bad: #D1261B; --gold: #C9A227;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: Archivo, system-ui, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { font-weight: 900; font-size: 28px; color: var(--red); letter-spacing: -1px; }
  .logo span { color: var(--paper); font-weight: 300; }
  .powered { margin-top: auto; padding-top: 24px; text-align: center; font-size: 11px; letter-spacing: 2px; opacity: .7; }
  .powered img { display: block; margin: 8px auto 0; width: 130px; height: auto; }
  .who { font-size: 14px; opacity: .8; text-align: right; }
  .who button { margin-top: 4px; padding: 6px 12px; font-size: 13px; }
  #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 3px solid var(--line); background: #000; }
  #reader video { width: 100% !important; }
  .row { display: flex; gap: 8px; }
  input, button { font: inherit; font-size: 16px; border-radius: 10px; padding: 12px 14px; border: 2px solid var(--line); background: #1f1f1f; color: var(--paper); }
  input { flex: 1; min-width: 0; }
  button { background: var(--red); border-color: var(--red); font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; border-color: var(--line); }
  button:disabled { opacity: .6; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .count { font-size: 13px; opacity: .6; text-align: center; }

  /* Login */
  #login { display: none; flex-direction: column; gap: 12px; margin-top: 12vh; }
  #login h1 { margin: 0 0 4px; font-size: 26px; }
  #login p { margin: 0 0 8px; opacity: .7; }
  #login input { width: 100%; }
  #loginErr { color: #ff8a80; min-height: 1.2em; font-size: 15px; }
  #app { display: none; flex-direction: column; gap: 14px; }

  /* Result screen */
  #result { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 10; }
  #result.show { display: flex; }
  #result.ok  { background: var(--ok); }
  #result.bad { background: var(--bad); }
  #result.checking { background: #333; }
  .spinner { width: 48px; height: 48px; border-radius: 50%; border: 5px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result.vip { box-shadow: inset 0 0 0 14px var(--gold); }
  .verdict { font-size: clamp(48px, 16vw, 96px); font-weight: 900; line-height: 1; letter-spacing: -2px; }
  .msg { font-size: 20px; margin: 12px 0 20px; font-weight: 600; }
  .ticket { background: rgba(0,0,0,.22); border-radius: 14px; padding: 16px 20px; width: 100%; max-width: 420px; text-align: left; }
  .ticket div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 17px; }
  .ticket b { font-weight: 800; text-align: right; }
  .badge { display: inline-block; padding: 6px 18px; border-radius: 30px; font-weight: 900; font-size: 20px; margin-bottom: 14px; }
  .badge.VIP { background: linear-gradient(135deg,#F3D57A,#C9A227,#9C7A14); color: #1A1712; }
  .badge.Regular { background: #fff; color: var(--ink); }
  #result button { margin-top: 22px; background: #fff; color: var(--ink); border-color: #fff; padding: 14px 40px; font-size: 18px; }
  @media (prefers-reduced-motion: no-preference) {
    #result.show .verdict { animation: pop .25s ease-out; }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TEDx<span>GUC</span></div>
    <div class="who" id="who"></div>

  <!-- Login screen -->
  <div id="login">
    <h1>Door staff login</h1>
    <p>Use the username and passcode your team lead gave you.</p>
    <input id="user" placeholder="Username" autocapitalize="none" autocomplete="username">
    <input id="pass" type="password" placeholder="Passcode" inputmode="numeric" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <div id="loginErr" role="alert"></div>

<div id="result" role="alert">
  <div class="verdict" id="verdict"></div>
  <div class="msg" id="msg"></div>
  <div id="ticketBox"></div>
  <button id="next">Scan next</button>
</div>

<script>
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  let scanner, busy = false;
  let count = Number(store.get('tedx_count') || 0);

  async function api(body) {
    const r = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(body) });
    return r.json();
  }

  /* ---------- Login / logout ---------- */
  function showLogin(message) {
    store.del('tedx_token'); store.del('tedx_name');
    $('app').style.display = 'none';
    $('login').style.display = 'flex';
    $('who').innerHTML = '';
    $('loginErr').textContent = message || '';
    stopCamera();
  }

  function showApp() {
    $('login').style.display = 'none';
    $('app').style.display = 'flex';
    $('who').innerHTML = `${esc(store.get('tedx_name'))}<br><button class="ghost" id="logoutBtn">Log out</button>`;
    $('logoutBtn').onclick = async () => {
      const token = store.get('tedx_token');
      showLogin();
      try { await api({ action: 'logout', token }); } catch {}
    };
    $('count').textContent = count + ' checked in on this device';
  }

  $('loginBtn').onclick = async () => {
    const username = $('user').value.trim(), passcode = $('pass').value.trim();
    if (!username || !passcode) { $('loginErr').textContent = 'Enter your username and passcode.'; return; }
    $('loginBtn').disabled = true; $('loginErr').textContent = 'Logging in…';
    try {
      const res = await api({ action: 'login', username, passcode });
      if (res.ok) {
        store.set('tedx_token', res.token); store.set('tedx_name', res.name);
        $('pass').value = ''; $('loginErr').textContent = '';
        showApp();
      } else {
        $('loginErr').textContent = res.message || 'Login failed';
      }
    } catch (e) {
      $('loginErr').textContent = 'No connection. Check the internet and try again.';
    }
    $('loginBtn').disabled = false;
  };
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

  /* ---------- Scanning ---------- */
  function beep(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = ok ? 880 : 220; o.type = ok ? 'sine' : 'square';
      o.connect(g); g.connect(ctx.destination); g.gain.value = .15;
      o.start(); o.stop(ctx.currentTime + (ok ? .15 : .45));
      if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 80, 200]);
    } catch {}
  }

  function parseQR(text) {
    const code = (text.match(/Code:\s*([A-Z0-9]+)/i) || [])[1];
    const key  = (text.match(/Key:\s*([A-F0-9]+)/i) || [])[1];
    if (code) return { code, key: key || 'MISSING' };        // a QR without a key is treated as fake
    return null;
  }

  async function checkIn(code, key) {
    try {
      const body = { action: 'checkin', token: store.get('tedx_token'), code };
      if (key) body.key = key;
      const res = await api(body);
      if (res.status === 'LOGIN') { busy = false; return showLogin('Your session ended. Please log in again.'); }
      show(res);
    } catch (e) {
      show({ ok:false, status:'ERROR', message:'No connection to the sheet. Check the internet and try again.' });
    }
  }

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function show(res) {
    const i = res.info;
    const ok = res.ok && res.status === 'ACCEPTED';
    $('result').className = 'show ' + (ok ? 'ok' : 'bad') + (i && i.type === 'VIP' ? ' vip' : '');
    $('verdict').textContent = ok ? 'ACCEPTED' : (res.status === 'REJECTED' ? 'REJECTED' : 'ERROR');
    $('msg').textContent = res.message || '';
    $('ticketBox').innerHTML = i ? `
      <span class="badge ${esc(i.type)}">${i.type === 'VIP' ? '★ VIP ★' : 'Regular'}</span>
      <div class="ticket">
        <div>Ticket <b>${esc(i.code)}</b></div>
        <div>Name <b>${esc(i.name)}</b></div>
        <div>Phone <b>${esc(i.phone)}</b></div>
        <div>GUCian <b>${i.gucian ? 'Yes' + (i.gucId ? ' – ' + esc(i.gucId) : '') : 'No'}</b></div>
        <div>Registered <b>${esc(i.registeredAt)}</b></div>
        ${i.checkinAt ? `<div>Checked in <b>${esc(i.checkinAt)}</b></div>` : ''}
      </div>` : '';
    beep(ok);
    if (ok) { count++; store.set('tedx_count', count); $('count').textContent = count + ' checked in on this device'; }
    $('next').focus();
  }

  $('next').onclick = () => { $('result').className = ''; busy = false; };
  $('manualBtn').onclick = () => {
    const c = $('manual').value.trim().toUpperCase();
    if (c) { $('manual').value = ''; checkIn(c, ''); }
  };
  $('manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('manualBtn').click(); });

  async function stopCamera() {
    if (!scanner) return;
    try { await scanner.stop(); } catch {}
    scanner = null;
    $('startBtn').style.display = '';
  }

  function onScan(text) {
    if (busy) return;
    const t = parseQR(text);
    if (!t) { busy = true; return show({ ok:false, status:'REJECTED', message:'This QR is not a TEDxGUC ticket.' }); }
    busy = true;
    flashChecking();
    checkIn(t.code, t.key);
  }

  function flashChecking() {
    $('result').className = 'show checking';
    $('verdict').textContent = '';
    $('msg').textContent = 'Checking…';
    $('ticketBox').innerHTML = '<div class="spinner"></div>';
  }

  // Lower resolution + native browser barcode decoder (when the phone supports it) removes
  // almost all of the lag; qrbox sized as a % of the video keeps the scan area steady on any screen.
  const SCAN_CONFIG = {
    fps: 12,
    qrbox: (vw, vh) => { const s = Math.floor(Math.min(vw, vh) * 0.75); return { width: s, height: s }; },
    aspectRatio: 1.0,
    disableFlip: false,
    videoConstraints: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 640 }, height: { ideal: 480 },
      advanced: [{ focusMode: 'continuous' }]   // keeps the lens locked instead of hunting for focus
    },
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  $('startBtn').onclick = async () => {
    if (scanner) return;
    scanner = new Html5Qrcode('reader', { verbose: false });
    try {
      await scanner.start({ facingMode: { ideal: 'environment' } }, SCAN_CONFIG, onScan);
      $('startBtn').style.display = 'none';
    } catch (e) {
      try {
        // Some phones reject the constraints above; fall back to the simplest possible request
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScan);
        $('startBtn').style.display = 'none';
      } catch (e2) {
        scanner = null;
        alert('Camera could not start. Allow camera access and make sure the page is opened over https.');
      }
    }
  };

  /* ---------- Start ---------- */
  if (WEB_APP_URL.startsWith('PASTE')) {
    showLogin('Setup needed: paste the web app URL at the top of this file.');
    $('loginBtn').disabled = true;
  } else if (store.get('tedx_token')) {
    showApp();
  } else {
    showLogin();
  }
</script>
</body>
</html>
